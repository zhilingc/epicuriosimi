name: publish

on:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r precompute/requirements.txt
      # yesterday through 3 days ahead: viewers in any timezone always find
      # their local date's puzzle, whatever hour the cron fires in UTC
      - name: generate puzzles
        run: python precompute/generate_daily.py --date "$(date -u -d yesterday +%F)" --days 4
      - name: assemble site
        run: |
          mkdir _site
          cp -r index.html style.css app.js lib vocab.json data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
